{% extends "base.html" %}
{% block title %}CareerMatch AI · Suggestions{% endblock %}
{% block content %}
<main id="main-content" class="cm-main">
    <section class="cm-shell">
        <div class="cm-panel" style="grid-column: 1 / -1; max-width: 780px; width: 100%; margin: 0 auto;">
            <div class="cm-page-head">
                <div>
                    <h2 class="cm-panel-title">Today's job suggestions</h2>
                    <p class="cm-page-lead">Ranked by match score. Open a role, apply externally, then mark it here.</p>
                </div>
            </div>

            <div id="suggestionsContainer" class="suggestions-list" aria-live="polite"></div>
        </div>
    </section>
</main>
{% endblock %}
{% block scripts %}
<script>
function showSkeleton(container) {
    container.innerHTML = `
        <div class="cm-skeleton-stack" aria-hidden="true">
            <div class="cm-skeleton-card"></div>
            <div class="cm-skeleton-card"></div>
            <div class="cm-skeleton-card"></div>
        </div>
        <p class="cm-muted" style="text-align:center;margin-top:0.75rem;">Loading suggestions…</p>
    `;
}

function renderEmpty(container) {
    container.innerHTML = `
        <div class="cm-empty">
            <div class="cm-empty-icon" aria-hidden="true">◇</div>
            <h3>No suggestions yet</h3>
            <p>Upload a resume from the dashboard to generate tailored job matches.</p>
            <a href="/dashboard" class="cm-link-btn cm-link-btn-primary">Go to dashboard</a>
        </div>
    `;
}

function renderJobCard(job, container) {
    const card = document.createElement("article");
    card.className = "job-card";

    const header = document.createElement("div");
    header.className = "job-header";

    const left = document.createElement("div");
    const title = document.createElement("div");
    title.className = "job-title";
    title.textContent = job.role || "Suggested role";

    if (job.company) {
        const companyEl = document.createElement("div");
        companyEl.className = "job-company";
        companyEl.textContent = job.company;
        left.appendChild(title);
        left.appendChild(companyEl);
    } else {
        left.appendChild(title);
    }

    const meta = document.createElement("div");
    meta.className = "job-meta";
    const bits = [];
    if (job.platform) bits.push(job.platform);
    if (job.date) bits.push("Suggested " + job.date);
    meta.textContent = bits.join(" · ");
    if (meta.textContent) left.appendChild(meta);

    const badge = document.createElement("span");
    badge.className = "match-badge";
    const score = job.match_score != null ? String(job.match_score) : "—";
    badge.textContent = score + "% match";

    header.appendChild(left);
    header.appendChild(badge);
    card.appendChild(header);

    const actions = document.createElement("div");
    actions.className = "job-card-actions";

    if (job.apply_url) {
        const link = document.createElement("a");
        link.href = job.apply_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className = "btn-view";
        link.textContent = "View job";
        actions.appendChild(link);
    }

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cm-button cm-button-primary";
    btn.textContent = "Mark as applied";
    btn.addEventListener("click", function() {
        markApplied(job.id);
    });
    actions.appendChild(btn);

    card.appendChild(actions);
    container.appendChild(card);
}

async function loadSuggestions() {
    const container = document.getElementById("suggestionsContainer");
    showSkeleton(container);

    try {
        const response = await fetch("/get_suggestions");
        const jobs = await response.json();

        container.innerHTML = "";

        if (!jobs.length) {
            renderEmpty(container);
            return;
        }

        jobs.forEach(function(job) {
            renderJobCard(job, container);
        });
    } catch (e) {
        console.error(e);
        container.innerHTML = `<p class="cm-error-inline">Could not load suggestions. Please refresh.</p>`;
    }
}

async function markApplied(jobId) {
    await fetch("/mark_applied/" + encodeURIComponent(String(jobId)), {
        method: "POST"
    });
    location.reload();
}

loadSuggestions();
</script>
{% endblock %}
