{% extends "base.html" %}
{% block title %}CareerMatch AI · Applied Jobs{% endblock %}
{% block content %}
<main id="main-content" class="cm-main">
    <section class="cm-shell">
        <div class="cm-panel" style="grid-column: 1 / -1; max-width: 780px; width: 100%; margin: 0 auto;">
            <div class="cm-page-head">
                <div>
                    <h2 class="cm-panel-title">Applied jobs</h2>
                    <p class="cm-page-lead">Roles you marked after applying. Open a link to revisit the posting.</p>
                </div>
            </div>

            <div id="appliedContainer" aria-live="polite">
                <div class="cm-skeleton-stack" aria-hidden="true">
                    <div class="cm-skeleton-card"></div>
                    <div class="cm-skeleton-card"></div>
                </div>
                <p class="cm-muted" style="text-align:center;margin-top:0.75rem;">Loading applied jobs…</p>
            </div>
        </div>
    </section>
</main>
{% endblock %}
{% block scripts %}
<script>
async function loadApplied() {
    const container = document.getElementById("appliedContainer");
    try {
        const resp = await fetch("/get_applied");
        if (resp.status === 401) {
            window.location.href = "/login";
            return;
        }
        const jobs = await resp.json();

        container.innerHTML = "";

        if (!jobs.length) {
            container.innerHTML = `
                <div class="cm-empty">
                    <div class="cm-empty-icon" aria-hidden="true">✓</div>
                    <h3>No applied jobs yet</h3>
                    <p>When you apply to a suggestion, mark it here to keep a record.</p>
                    <a href="/suggestions" class="cm-link-btn cm-link-btn-primary">Browse suggestions</a>
                </div>`;
            return;
        }

        jobs.forEach(function(job) {
            const card = document.createElement("article");
            card.className = "job-card";

            const header = document.createElement("div");
            header.className = "job-header";

            const left = document.createElement("div");
            const title = document.createElement("div");
            title.className = "job-title";
            title.textContent = job.role || "Position";

            const company = document.createElement("div");
            company.className = "job-company";
            const parts = [];
            if (job.company) parts.push(job.company);
            if (job.platform) parts.push(job.platform);
            if (job.applied_date) parts.push(job.applied_date);
            company.textContent = parts.join(" · ");

            left.appendChild(title);
            left.appendChild(company);

            const status = document.createElement("span");
            status.className = "status-badge";
            status.textContent = (job.status || "applied").toUpperCase();

            header.appendChild(left);
            header.appendChild(status);
            card.appendChild(header);

            if (job.apply_url) {
                const link = document.createElement("a");
                link.href = job.apply_url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.className = "btn-view";
                link.textContent = "View job";
                card.appendChild(link);
            }

            container.appendChild(card);
        });

    } catch (err) {
        console.error(err);
        container.innerHTML = `<p class="cm-error-inline">Failed to load. Please refresh.</p>`;
    }
}

loadApplied();
</script>
{% endblock %}
