<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerMatch AI · Applied Jobs</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<header class="cm-header">
<div class="cm-header-inner">
<div class="cm-logo">
<span class="cm-logo-mark">CM</span>
<span class="cm-logo-text">CareerMatch AI</span>
</div>

<nav class="cm-nav">
<a href="/dashboard" class="cm-nav-link">Dashboard</a>
<a href="/applied" class="cm-nav-link cm-nav-link-active">Applied Jobs</a>
<a href="/suggestions" class="cm-nav-link">Suggestions</a>
<a href="/profile" class="cm-nav-link">Profile</a>
</nav>
</div>
</header>

<main class="cm-main">
    <section class="cm-shell">
        <div class="cm-panel" style="width:100%; max-width:780px; margin:0 auto;">

            <h2 class="cm-panel-title">✅ Applied Jobs</h2>

            <div id="appliedContainer">
                <div style="text-align:center; padding:40px; color:#64748b;">
                    <p>Loading applied jobs…</p>
                </div>
            </div>

        </div>
    </section>
</main>


<script>
async function loadApplied() {
    const container = document.getElementById("appliedContainer");
    try {
        const resp = await fetch("/get_applied");
        if (resp.status === 401) { window.location.href = "/login"; return; }
        const jobs = await resp.json();

        if (!jobs.length) {
            container.innerHTML = `
                <div class="cm-empty">
                    <div style="font-size:3rem;">📭</div>
                    <h3 style="color:#1a1a2e; margin:12px 0 8px;">No applied jobs yet</h3>
                    <p>Go to Suggestions and click Applied after applying to a job.</p>
                    <br>
                    <a href="/suggestions"
                       style="display:inline-block; background:#1a1a2e; color:white;
                              padding:10px 24px; border-radius:8px; text-decoration:none;
                              font-weight:600;">
                        Browse Suggestions →
                    </a>
                </div>`;
            return;
        }

        let html = "";
        jobs.forEach(job => {
            html += `
            <div class="job-card">
                <div class="job-header">
                    <div>
                        <div class="job-title">${job.role || "Position"}</div>
                        <div class="job-company">
                            🏢 ${job.company || "Company"}
                            ${job.platform ? ` &nbsp;·&nbsp; 📌 ${job.platform}` : ""}
                            &nbsp;·&nbsp; 📅 ${job.applied_date || ""}
                        </div>
                    </div>
                    <span class="status-badge">✅ ${job.status || "applied"}</span>
                </div>
                ${job.apply_url ? `
                    <a href="${job.apply_url}" target="_blank" class="btn-view">
                        View Job ↗
                    </a>` : ""}
            </div>`;
        });

        container.innerHTML = html;

    } catch(err) {
        console.error(err);
        container.innerHTML = "<p style='color:red'>Failed to load. Please refresh.</p>";
    }
}

loadApplied();
</script>

</body>
</html>
